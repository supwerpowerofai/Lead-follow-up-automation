name: Agent Nexus tests

on:
  push:
    paths:
      - "agent-nexus/**"
      - ".github/workflows/agent-nexus-tests.yml"
  pull_request:
    paths:
      - "agent-nexus/**"
      - ".github/workflows/agent-nexus-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Agent Nexus unit tests
        run: python -m unittest discover -s agent-nexus -p "test_*.py" -v
